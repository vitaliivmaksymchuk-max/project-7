<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Веб-додаток для керування завданнями та нотатками з перевіркою доступності, адаптивності та модульним тестуванням.">
  <title>TaskFlow — Менеджер завдань</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <script src="tests.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="container">
      <h1>TaskFlow</h1>
      <p class="subtitle">Система обліку та контролю робочих завдань</p>
    </div>
  </header>

  <main class="container">
    <nav class="tabs" aria-label="Фільтр завдань">
      <button type="button" class="tab-btn active" data-filter="all">Усі завдання (<span id="count-all">0</span>)</button>
      <button type="button" class="tab-btn" data-filter="active">Активні (<span id="count-active">0</span>)</button>
      <button type="button" class="tab-btn" data-filter="completed">Виконані (<span id="count-completed">0</span>)</button>
    </nav>

    <section class="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading" class="visually-hidden">Додати нове завдання</h2>
      <form id="task-form" novalidate>
        <div class="input-group">
          <label for="task-input">Текст нового завдання:</label>
          <div class="input-row">
            <input 
              type="text" 
              id="task-input" 
              name="task-input" 
              placeholder="Наприклад: Підготувати звіт до ПР №7..." 
              maxlength="350"
              autocomplete="off"
              required
            >
            <button type="submit" class="btn-primary">Додати</button>
          </div>
          <p id="error-msg" class="error-text" role="alert" aria-live="polite"></p>
        </div>
      </form>
    </section>

    <section class="list-section" aria-labelledby="list-heading">
      <h2 id="list-heading" class="section-title">Список завдань</h2>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty-state">Список порожній. Додайте перше завдання вище.</p>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <p>Практична робота № 7 • Тестування та аудит якості веб-додатків</p>
    </div>
  </footer>
</body>
</html>
